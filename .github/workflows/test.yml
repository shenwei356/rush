name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - if: runner.os == 'Linux'
        shell: bash
        run: bash tests/test1.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: go test ./... -run 'TestWindows'
      - if: runner.os == 'macOS'
        run: go test . -run 'TestUnixProcessGroupCleanup'
      - run: go vet ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - if: runner.os == 'Linux'
        run: go test -count=10 ./...
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          for target in linux/386 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/386 windows/amd64 windows/arm64 openbsd/amd64 openbsd/arm64 freebsd/amd64 freebsd/arm64; do
            target_goos=${target%/*}
            target_goarch=${target#*/}
            GOOS=${target_goos} GOARCH=${target_goarch} CGO_ENABLED=0 go build -trimpath -tags netgo -o "${RUNNER_TEMP}/rush-${target_goos}-${target_goarch}" .
          done
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          for arch in 386 amd64 arm64; do
            GOOS=windows GOARCH=${arch} CGO_ENABLED=0 go test -c -o "${RUNNER_TEMP}/rush-windows-${arch}.test.exe" .
            GOOS=windows GOARCH=${arch} CGO_ENABLED=0 go test -c -o "${RUNNER_TEMP}/rush-process-windows-${arch}.test.exe" ./process
          done
